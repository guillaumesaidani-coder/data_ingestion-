[project]
name = "py-init"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "jupyter>=1.1.1",
    "matplotlib>=3.11.0",
    "nbconvert>=7.17.1",
    "pandas>=2.2",
    "seaborn>=0.13.2",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg2-binary>=2.9",
    "python-dotenv>=1.0",
    "pydantic>=2.0",
    "xgboost>=3.3.0",
    "scikit-learn>=1.9.0",
    "optuna>=4.9.0",
    "huggingface-hub>=1.24.0",
    "codecarbon>=3.2.9",
    "mlflow==3.14.0",
    "pyyaml>=6.0.3",
    "fastapi>=0.139.2",
    "uvicorn[standard]>=0.51.0",
    "prometheus-client>=0.25.0",
]

[project.scripts]
indusense = "indusense.cli:main"

[dependency-groups]
dev = [
    "black>=26.5.1",
    "dvc>=3.67.1",
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]
dl = [
    "albumentations>=1.3",
    "opencv-python>=4.8",
    "scikit-image>=0.22",
    "Pillow>=10.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/indusense"]

[tool.ruff.lint]
# DTZ005 (datetime.now() sans tz) desactive : create_ingestion_dir() utilise
# volontairement l'heure locale naive (comportement du notebook original,
# jamais modifie lors de l'extraction) ; le corriger changerait le format
# des dossiers d'ingestion deja produits.
ignore = ["DTZ005"]

[tool.black]
line-length = 100

[tool.pytest.ini_options]
markers = [
    "requires_local_infra: needs the live Postgres (docker-db-1) and/or DVC-pulled data files ; not available in CI, run locally only (deselect with -m 'not requires_local_infra')",
]
