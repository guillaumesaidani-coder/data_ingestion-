# Stack unique InduSense (recommandation R1) : une seule base, lue par
# pgAdmin, les jobs (etl, predict, migrate) et, depuis le PC, Streamlit et les
# flows ; initialisée automatiquement au premier démarrage. L'API et
# Grafana ne la lisent pas (modèle en mémoire, Prometheus).
#
#   docker compose up -d --build                  # la stack
#   docker compose --profile jobs run --rm etl    # reconstruire Silver + Gold
#   docker compose --profile jobs run --rm predict  # scorer les dernières fenêtres
#   docker compose --profile jobs run --rm migrate  # appliquer les migrations alembic
#
# Remplace Docker/docker-compose.yml (docker-db-1 + pgAdmin) : arrêter
# cette ancienne stack avant (docker compose stop, dans Docker/), les deux
# publient les ports 5432 et 8082.

# Connexion à la base, partagée par api, etl et migrate.
x-db-env: &db-env
  DB_HOST: db
  DB_USER: indusense_user
  DB_PASSWORD: ThEP@ssW0rd
  DB_NAME: indusense_db
  DB_PORT: "5432"
  # Pas de PREDICTIONS_DB_URL : get_predictions_db_url() la dérive de DB_*
  # (même base, mot de passe encodé par SQLAlchemy), plus de second
  # exemplaire des identifiants à tenir à jour.

# Une seule recette de build, pour l'API ET les jobs : `run --build` ne
# reconstruit qu'un service qui déclare `build`. Sans elle, un job lancé
# après un pull tournait sur une image ancienne sans le signaler.
# GIT_SHA : commit inscrit dans l'image (label, /health, journaux des
# flows). Fourni par le Makefile ; sans make :
#   export GIT_SHA=$(git describe --always --dirty)
# sinon l'image se déclare « inconnue ».
x-build: &build
  context: .
  args:
    GIT_SHA: ${GIT_SHA:-inconnue}

# Flow Prefect lancé en job : même image que l'API, identifiants de la base.
x-flow-job: &flow-job
  build: *build
  image: indusense-api:local
  # Reconstruit à chaque lancement, même par un `docker compose run` nu
  # (sans --build ni make) : le cache Docker rend l'opération quasi
  # gratuite si rien n'a changé, et un job ne tourne jamais sur l'ancien code.
  pull_policy: build
  profiles: ["jobs"]
  environment:
    <<: *db-env
    # Serveur Prefect éphémère : son 1er démarrage (création de la base
    # sur un volume vide) dépasse le délai par défaut dans le conteneur.
    PREFECT_SERVER_EPHEMERAL_STARTUP_TIMEOUT_SECONDS: "120"
  volumes:
    # /app/data : PREFECT_HOME (/app/data/.prefect, Dockerfile) et l'export
    # data/gold/gold_dataset.csv de predict. Sans volume, la base Prefect
    # de chaque run disparaît avec le conteneur (--rm) et le journal des
    # flows lancés ici est perdu. /app/data appartient déjà à appuser dans
    # l'image : le volume hérite de ces droits.
    - prefect_jobs:/app/data
  depends_on:
    db:
      condition: service_healthy

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: indusense_db
      POSTGRES_USER: indusense_user
      POSTGRES_PASSWORD: ThEP@ssW0rd
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U indusense_user -d indusense_db"]
      interval: 5s
      timeout: 3s
      retries: 10
      # -h 127.0.0.1 : pendant la restauration du seed, Postgres n'écoute
      # que sur son socket local ; tester en TCP évite de se déclarer prêt
      # avant la fin de l'initialisation.
      start_period: 180s
    ports:
      # Publié : notebooks, flows et Streamlit lancés sur le PC utilisent
      # localhost:5432 (ML/.env), comme avant avec docker-db-1.
      # 127.0.0.1 seulement : le mot de passe de dev est dans le dépôt, la base
      # ne doit pas être joignable depuis le réseau local.
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Joué une seule fois, sur un volume vide : dump de la base peuplée
      # + table predictions (scripts/build_seed_dump.py, versionné par DVC).
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro

  api:
    build: *build
    image: indusense-api:local
    pull_policy: build   # même règle que les jobs (x-flow-job)
    # Ni identifiants ni dépendance sur db : l'API charge le modèle et
    # répond, elle ne lit ni n'écrit la base (au 1er up, elle n'attend
    # plus la restauration du seed pour démarrer).
    environment:
      API_KEY: dev-local-key
    ports:
      - "8010:8000"
    # HEALTHCHECK deja defini dans le Dockerfile (GET /health) : rien a
    # ajouter ici, c'est lui que service_healthy attendra plus bas.

  pgadmin:
    image: dpage/pgadmin4:6.15
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      # Serveur « InduSense » déjà déclaré : plus d'enregistrement à la main.
      - ./docker/pgadmin/servers.json:/pgadmin4/servers.json:ro
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8082:80"

  prometheus:
    image: prom/prometheus:v3.1.0
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./drift_alert_rules.yml:/etc/prometheus/drift_alert_rules.yml:ro
      - prometheus_data:/prometheus
    extra_hosts:
      # host.docker.internal est natif sous Docker Desktop (Windows/Mac) ;
      # cette ligne le rend explicite et porte le meme compose.yaml sous Linux.
      - "host.docker.internal:host-gateway"
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "9091:9090"
    healthcheck:
      # Image officielle sans HEALTHCHECK natif : on l'ecrit contre la
      # propre readiness de Prometheus.
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/ready"]
      interval: 5s
      timeout: 3s
      retries: 10

  grafana:
    image: grafana/grafana:11.4.0
    depends_on:
      prometheus:
        condition: service_healthy
    ports:
      - "3010:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:3000/api/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ---- Jobs ponctuels (profil « jobs ») : lancés à la demande, puis s'arrêtent.
  # Les flows tournent dans ces jobs, pas dans le service api : l'API n'a
  # ni identifiants ni dépendance sur la base.

  etl:
    <<: *flow-job
    command: ["python", "-m", "indusense.flows.etl_flow"]

  predict:
    <<: *flow-job
    command: ["python", "-m", "indusense.flows.predict_flow"]

  migrate:
    build: *build
    image: indusense-api:local
    pull_policy: build
    profiles: ["jobs"]
    environment: *db-env
    volumes:
      # Les migrations vivent à la racine du dépôt, hors du contexte de
      # build (ML/) : montées en lecture seule plutôt que copiées dans l'image.
      - ../alembic:/app/alembic:ro
      # alembic/env.py importe `models` (métadonnées SQLAlchemy du schéma).
      - ./models.py:/app/models.py:ro
    command:
      - python
      - -c
      - |
        from alembic import command
        from alembic.config import Config
        from indusense.config import get_db_url
        cfg = Config()
        cfg.set_main_option("script_location", "/app/alembic")
        cfg.set_main_option("sqlalchemy.url", get_db_url().render_as_string(hide_password=False).replace("%", "%%"))
        command.upgrade(cfg, "head")
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  pgadmin_data:
  prometheus_data:
  grafana_data:
  prefect_jobs:
