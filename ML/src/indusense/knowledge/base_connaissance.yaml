# Colonnes du Gold qui ne doivent JAMAIS entrer dans le modèle
# (indusense.modeling.dataset.LEAKAGE_COLS). Une seule présente dans le
# modèle = contrôle bloquant.
exclusions:
  machine_id: {categorie: identifiant, raison: "Le modèle apprendrait les machines, pas les mécanismes de panne (GroupKFold par machine)."}
  ingestion_batch_id: {categorie: technique, raison: "Trace de chargement, sans lien avec l'état de la machine."}
  feature_row_id: {categorie: technique, raison: "Clé technique de ligne."}
  window_start: {categorie: identifiant, raison: "Horodatage ; le modèle apprendrait la période, pas la machine."}
  window_end: {categorie: identifiant, raison: "Horodatage ; même raison que window_start."}
  split_set: {categorie: technique, raison: "Étiquette de découpage train / validation / test."}
  label_failure_next_24h: {categorie: cible, raison: "Cible du modèle."}
  label_failure_next_6h: {categorie: cible, raison: "Cible d'un autre horizon, incluse dans la cible 24 h."}
  label_failure_next_12h: {categorie: cible, raison: "Cible d'un autre horizon, incluse dans la cible 24 h."}
  label_failure_next_48h: {categorie: cible, raison: "Cible d'un autre horizon, contient la cible 24 h."}
  future_incident_count_6h: {categorie: fuite, raison: "Compte d'incidents futurs, équivalent de la cible."}
  future_incident_count_12h: {categorie: fuite, raison: "Compte d'incidents futurs, équivalent de la cible."}
  future_incident_count_24h: {categorie: fuite, raison: "Compte d'incidents futurs, la cible avant seuillage."}
  future_incident_count_48h: {categorie: fuite, raison: "Compte d'incidents futurs, contient la cible."}

# Règles de décision : ce que le système fait d'un score.
regles:
  seuil_alerte:
    valeur: 0.5
    texte: "Alerte si la probabilité de panne sous 24 h atteint le seuil (seuil d'entraînement et d'évaluation du modèle b11)."
  validation_humaine:
    texte: "Aucune action automatique ; chaque alerte est confirmée ou infirmée par un technicien (Streamlit, table predictions)."

# Seuils et gravités des contrôles, fixés dans la base, jamais ajustés à
# un résultat du modèle.
controles:
  part_max_une_variable: 0.5      # bloquant : au-delà, fuite probable
  part_max_une_famille: 0.6       # avertissement : voir la note ci-dessous
  correlation_sens_min: 0.1       # |rho| sous lequel un sens contraire n'est pas signalé
  part_negligeable: 0.001         # information : variable qui ne pèse rien
# Note sur part_max_une_famille : la promesse du produit est d'anticiper
# une panne par les CAPTEURS. Si une famille non capteur (incidents,
# maintenance) porte l'essentiel de l'explication, le modèle fait autre
# chose que ce qui est promis. ATTENTION : ce seuil a été fixé après avoir
# vu la répartition du modèle b11 (scripts/certify_model.py) ;
# il doit être validé par le métier avant d'être considéré comme a priori.
