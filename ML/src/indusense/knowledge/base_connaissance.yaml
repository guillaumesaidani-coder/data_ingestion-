# Base de connaissance InduSense : ce que l'on sait du domaine AVANT de
# regarder le modèle. Écrite à la main, versionnée par Git, livrée avec le
# paquet (donc présente dans l'image de l'API).
#
# Elle sert deux fois (indusense.explain) :
#   1. formuler les explications (libellés, unités, plages) ;
#   2. contrôler le modèle (exclusions, couverture, sens, concentration).
#
# Règle d'or : `sens` vient du métier (physique de la machine, types
# d'incident du référentiel), jamais de ce que le modèle a appris. Sinon
# le contrôle de sens validerait toujours le modèle. `indetermine` quand
# aucune hypothèse n'est défendable : pas de contrôle de sens pour eux.
#
# Plages : bornes physiques du contrat DAT §5.4 (indusense.data_quality),
# appliquées aux moyennes et maximums ; absentes quand le contrat n'en
# donne pas.

familles:
  temperature:
    libelle: Température
    justification: "Surchauffe = type d'incident du référentiel ; une machine qui chauffe ou dont la température varie se dégrade."
  pression:
    libelle: Pression
    justification: "Baisse de pression = type d'incident, mais une surpression est aussi anormale ; seule l'instabilité (écart-type) a un sens défendable."
  tension:
    libelle: Tension
    justification: "Surconsommation = type d'incident ; le niveau seul ne dit rien, l'instabilité si."
  rotation:
    libelle: Rotation
    justification: "Vibration et bruit mécanique = types d'incident ; une rotation instable les précède."
  production:
    libelle: Production
    justification: "Usage intensif (usure) ou machine à l'arrêt (déjà en panne) : les deux lectures se défendent."
  incidents:
    libelle: Historique d'incidents
    justification: "Les pannes graves sont précédées d'incidents mineurs (précurseurs) ; plus l'historique récent est chargé, plus le risque monte."
  maintenance:
    libelle: Maintenance
    justification: "Une machine longtemps sans maintenance s'use ; le nombre d'interventions récentes est ambigu (préventive ou corrective)."

